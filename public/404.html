<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada · Kronos</title>
<link rel="icon" type="image/svg+xml" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --orange:#F15A24;--orange2:#FF8C42;--orange-light:#FFF0EA;
  --bg:#FFF8F5;--surface:#FFFFFF;--border:#F0E0D6;
  --text:#1A1A2E;--muted:#8B7E78;
  --font:'Nunito',sans-serif;
}
body.dark{
  --bg:#0F0F14;--surface:#1A1A24;--border:#2A2A3D;
  --text:#E8E8F0;--muted:#9090AA;--orange-light:rgba(241,90,36,0.10);
}
body{
  background:var(--bg);font-family:var(--font);
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px;
  transition:background 0.3s,color 0.3s;
}
.bg-circles{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-circle{position:absolute;border-radius:50%;opacity:0.06;}
.bg-circle:nth-child(1){width:500px;height:500px;background:var(--orange);top:-150px;right:-150px;}
.bg-circle:nth-child(2){width:300px;height:300px;background:var(--orange2);bottom:-100px;left:-80px;}
.card{
  position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:56px 48px;
  max-width:480px;width:100%;text-align:center;
  box-shadow:0 16px 48px rgba(241,90,36,0.12);
}
body.dark .card{box-shadow:0 16px 48px rgba(0,0,0,0.5);}
.icon-wrap{
  width:80px;height:80px;margin:0 auto 24px;
  background:var(--orange-light);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.icon-wrap svg{color:var(--orange);}
.code{
  font-family:'Nunito',sans-serif;font-size:5rem;font-weight:900;
  color:var(--orange);letter-spacing:-0.04em;line-height:1;
  margin-bottom:8px;
}
.title{font-size:1.3rem;font-weight:800;color:var(--text);margin-bottom:10px;}
.desc{font-size:0.88rem;color:var(--muted);font-weight:600;line-height:1.6;margin-bottom:32px;}
.btn-home{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#fff;font-family:var(--font);font-size:0.9rem;font-weight:800;
  padding:12px 28px;border-radius:12px;border:none;cursor:pointer;
  text-decoration:none;transition:all 0.2s;
  box-shadow:0 4px 16px rgba(241,90,36,0.35);
}
.btn-home:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(241,90,36,0.45);}
.btn-home:active{transform:translateY(0);}
.footer{
  margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
  font-size:0.72rem;color:var(--muted);
}
.theme-toggle{
  position:fixed;top:20px;right:20px;z-index:10;
  background:transparent;border:none;cursor:pointer;
  color:var(--orange);padding:6px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.2s;
}
.theme-toggle:hover{opacity:0.75;}
@media(prefers-reduced-motion:reduce){.btn-home{transition:none;}}
@media(max-width:480px){.card{padding:36px 24px;}.code{font-size:4rem;}}
</style>
</head>
<body>
<div class="bg-circles">
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
</div>

<button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema">
  <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="card">
  <div class="icon-wrap">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="11" y1="8" x2="11" y2="14"/>
      <line x1="8" y1="11" x2="14" y2="11"/>
    </svg>
  </div>
  <div class="code">404</div>
  <div class="title">Página não encontrada</div>
  <div class="desc">
    O endereço que você tentou acessar não existe ou foi movido.<br>
    Verifique o link ou volte para o início.
  </div>
  <a href="index_v2.html" class="btn-home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Ir para o início
  </a>
  <div class="footer">Kronos · Labtecie</div>
</div>

<script>
const SVG_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SVG_SUN  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
function toggleTheme(){
  document.body.classList.toggle('dark');
  const icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = document.body.classList.contains('dark') ? SVG_SUN : SVG_MOON;
  try { localStorage.setItem('kronos_theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch(e){}
}
try {
  if(localStorage.getItem('kronos_theme') === 'dark'){
    document.body.classList.add('dark');
    const icon = document.getElementById('themeIcon');
    if(icon) icon.innerHTML = SVG_SUN;
  }
} catch(e){}
</script>
</body>
</html>
